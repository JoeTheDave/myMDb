name: Deploy Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.staging.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  notify-failure:
    needs: [push, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Central Command
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CC_WEBHOOK_SECRET }}" \
            -d "{\"event\":\"ci-failed\",\"branchName\":\"${{ github.ref_name }}\",\"runId\":\"${{ github.run_id }}\",\"repo\":\"${{ github.repository }}\"}" \
            https://central-command.sage-development.net/api/webhook/github || true
